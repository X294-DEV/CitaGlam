<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Nuclear Reset: Clear all service workers and caches immediately
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (const registration of registrations) {
            console.warn('[Nuclear Reset] Unregistering Service Worker:', registration.scope);
            registration.unregister();
          }
          if (registrations.length > 0) {
            console.log('[Nuclear Reset] SW cleared. Forcing reload.');
            window.location.reload(true);
          }
        });
      }
    </script>
    <title>CitaGlam - Gestión de Citas</title>
