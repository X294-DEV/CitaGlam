<div class="login-container">
  <!-- Izquierda: Estética Zen (Imagen) -->
  <div class="login-visual">
    <div class="visual-overlay"></div>
    <div class="visual-content">
      <h2 class="visual-quote">"Gestiona tus citas y clientes con elegancia."</h2>
    </div>
  </div>

  <!-- Derecha: Interacción (Formulario) -->
  <div class="login-form-container">
    <div class="form-card">
      <header class="form-header">
        <!-- Espacio para Logo futuro -->
        <div class="logo-placeholder">
          <img src="brand/citaglam-login.png" alt="CitaGlam Logo" class="login-brand-logo">
        </div>
        <p class="subtitle">Gestiona tu negocio con serenidad.</p>
      </header>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            placeholder="ejemplo@negocio.com"
            [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            formControlName="password" 
            placeholder="••••••••"
            [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          >
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" formControlName="remember">
            <span class="checkmark"></span>
            Recordarme
          </label>
          <a href="javascript:void(0)" (click)="onForgotPassword()" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <div *ngIf="errorMessage" class="error-banner">
          {{ errorMessage }}
        </div>

        <button type="submit" class="btn-primary" [disabled]="loginForm.invalid || isLoading">
          <span *ngIf="!isLoading">Iniciar Sesión</span>
          <span *ngIf="isLoading">Cargando...</span>
        </button>
      </form>

      <footer class="form-footer">
        <p>¿Nuevo en CitaGlam?</p>
        <button class="btn-secondary" (click)="registerRedirect()">Registra tu Negocio</button>
      </footer>
    </div>
  </div>
</div>
