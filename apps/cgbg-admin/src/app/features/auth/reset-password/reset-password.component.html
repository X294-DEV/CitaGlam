<div class="login-container">
  <!-- Izquierda: Estética Zen (Imagen) -->
  <div class="login-visual">
    <div class="visual-overlay"></div>
    <div class="visual-content">
      <h2 class="visual-quote">"Recupera el control con serenidad."</h2>
    </div>
  </div>

  <!-- Derecha: Interacción (Formulario) -->
  <div class="login-form-container">
    <div class="form-card animate-fade-in">
      <header class="form-header">
        <div class="logo-placeholder">
          <img src="brand/citaglam-login.png" alt="CitaGlam Logo" class="login-brand-logo">
        </div>
        <h2 class="setup-title">Nueva Contraseña</h2>
        <p class="subtitle">Ingresa tu nueva clave de acceso para restaurar tu cuenta.</p>
      </header>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label for="password">Contraseña Nueva</label>
          <input 
            type="password" 
            id="password" 
            formControlName="password" 
            placeholder="Mínimo 8 caracteres"
            [class.error]="resetForm.get('password')?.invalid && resetForm.get('password')?.touched"
          >
          <div class="field-info" *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.invalid">
             <span *ngIf="resetForm.get('password')?.errors?.['required']">La contraseña es requerida.</span>
             <span *ngIf="resetForm.get('password')?.errors?.['minlength']">Mínimo 8 caracteres por seguridad.</span>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Contraseña</label>
          <input 
            type="password" 
            id="confirmPassword" 
            formControlName="confirmPassword" 
            placeholder="Repite tu nueva contraseña"
            [class.error]="(resetForm.get('confirmPassword')?.touched || resetForm.touched) && resetForm.errors?.['passwordMismatch']"
          >
          <div class="field-info error" *ngIf="(resetForm.get('confirmPassword')?.touched || resetForm.touched) && resetForm.errors?.['passwordMismatch']">
             <span>Las contraseñas no coinciden.</span>
          </div>
        </div>

        <div *ngIf="errorMessage()" class="error-banner">
          {{ errorMessage() }}
        </div>

        <button type="submit" class="btn-primary" [disabled]="resetForm.invalid || isLoading()">
          <span *ngIf="!isLoading()">Cambiar Contraseña y Entrar</span>
          <span *ngIf="isLoading()" class="loader-group">
            <span class="spinner-mini"></span> Restaurando...
          </span>
        </button>
      </form>

      <footer class="form-footer">
        <p>¿Recordaste tu contraseña?</p>
        <a routerLink="/auth/login" class="support-text">Volver al inicio de sesión</a>
      </footer>
    </div>
  </div>
</div>
